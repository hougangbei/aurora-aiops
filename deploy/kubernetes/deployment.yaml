apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-aiops
  namespace: aurora-aiops
  labels:
    app.kubernetes.io/name: aurora-aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aurora-aiops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aurora-aiops
    spec:
      serviceAccountName: aurora-aiops-readonly
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: aurora-aiops
        image: aurora-aiops:local
        imagePullPolicy: IfNotPresent
        args: []
        env:
        - name: HTTP_ADDR
          value: ":8080"
        - name: AURORA_AIOPS_AIOPS_DB
          value: /var/lib/aurora-aiops/aurora-aiops.db
        - name: AURORA_AIOPS_RUNTIME_DIR
          value: /var/run/aurora-aiops
        # 平台身份通过 ServiceAccount（in-cluster）访问集群，不挂载 kubeconfig。
        - name: AURORA_AIOPS_BOOTSTRAP_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: aurora-aiops-secrets
              key: bootstrap-admin-user
        - name: AURORA_AIOPS_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aurora-aiops-secrets
              key: bootstrap-admin-password
        # LLM API Key 只通过 Secret 引用，样例文件不放真实值。
        - name: AURORA_AIOPS_LLM_BASE_URL
          value: ""
        - name: AURORA_AIOPS_LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: aurora-aiops-secrets
              key: llm-api-key
              optional: true
        - name: AURORA_AIOPS_LLM_MODEL
          value: ""
        ports:
        - containerPort: 8080
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/aurora-aiops
        - name: runtime
          mountPath: /var/run/aurora-aiops
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: aurora-aiops-data
      - name: runtime
        emptyDir:
          medium: Memory
