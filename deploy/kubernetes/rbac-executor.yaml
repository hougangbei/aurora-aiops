# 可执行权限样例：只有需要执行修复动作时才启用，默认不安装。
# 将 deployment.yaml 的 serviceAccountName 改为 aurora-aiops-executor 并 apply 本段。
# 执行仅限 Deployment/CronJob 的 update/patch，Pod exec 仍然拒绝。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aurora-aiops-executor
  namespace: aurora-aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aurora-aiops-executor-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aurora-aiops-readonly
subjects:
- kind: ServiceAccount
  name: aurora-aiops-executor
  namespace: aurora-aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aurora-aiops-executor-write
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aurora-aiops-executor-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aurora-aiops-executor-write
subjects:
- kind: ServiceAccount
  name: aurora-aiops-executor
  namespace: aurora-aiops
