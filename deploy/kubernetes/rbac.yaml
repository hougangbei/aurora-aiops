# 默认安装只读权限：只能查看集群资源，不能写。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubejojo-readonly
  namespace: kubejojo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubejojo-readonly
  namespace: kubejojo
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "secrets",
              "persistentvolumeclaims", "namespaces", "nodes", "events",
              "serviceaccounts"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies", "ingresses", "ingressclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses", "persistentvolumes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubejojo-readonly
  namespace: kubejojo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubejojo-readonly
subjects:
- kind: ServiceAccount
  name: kubejojo-readonly
  namespace: kubejojo
---
# 可执行权限样例：只有需要执行修复动作时才启用，默认不安装。
# 将 deployment.yaml 的 serviceAccountName 改为 kubejojo-executor 并 apply 本段。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubejojo-executor
  namespace: kubejojo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubejojo-executor
  namespace: kubejojo
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubejojo-executor
  namespace: kubejojo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubejojo-executor
subjects:
- kind: ServiceAccount
  name: kubejojo-executor
  namespace: kubejojo
